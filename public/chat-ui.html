<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
   <style>
    body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  padding: 0;
  background: #f5f6fa;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Contenedor principal del chat */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  background: #ffffff;
  box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
}

/* Contenedor del input */
#inputArea {
  display: flex;
  padding: 12px;
  gap: 8px;
  background: #fff;
  border-top: 1px solid #e5e7eb;
}

/* Input */
#userInput {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  outline: none;
  background: #f9fafb;
  font-size: 14px;
}

/* Botón */
button {
  padding: 12px 20px;
  border: none;
  background: #2563eb;
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.2s;
}

button:hover {
  background: #1d4ed8;
}

.bot-message {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  padding: 14px 18px;
  border-radius: 14px 14px 14px 4px;
  max-width: 85%;
  margin: 10px 0;
  font-size: 14px;
  line-height: 1.4;
  font-family: "Inter", sans-serif;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  animation: fadeIn 0.4s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}


.user-message {
  background: #e5e7eb;
  color: #111;
  margin-left: auto;
}

</style>

  </head>
  <body>
    <div id="messages"></div>
    <div id="inputArea">
      <input id="userInput" placeholder="Escribe tu mensaje..." />
      <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
      const webhook = 'https://servidor-principal7-n8n.zl81nh.easypanel.host/webhook/c6ec962f-3d7e-4c0e-8a41-0a12670b48c9/chat';

      function addMessage(text, sender) {
  const div = document.createElement("div");

  if (sender === "user") {
    div.className = "user-message";
    div.textContent = text;
  } else {
    div.className = "bot-message";
    div.textContent = text;
  }

  document.getElementById("messages").appendChild(div);

  // Siempre scrollear hacia abajo
  const messages = document.getElementById("messages");
  messages.scrollTop = messages.scrollHeight;
}


     async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  try {
    const res = await fetch(webhook, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    const botReply =
      data.answer ||
      data.reply ||
      data.message ||
      data.output ||
      JSON.stringify(data);

    addMessage(botReply, "bot");
  } catch (error) {
    addMessage("Error al conectar con el servidor.", "bot");
  }
}
    </script>
    <script>
  window.addEventListener("DOMContentLoaded", () => {
    const messages = document.getElementById("messages");

    const initialMessage = document.createElement("div");
    initialMessage.className = "bot-message";
    initialMessage.textContent =
      "Hola, mi nombre es Ale 👋 Soy tu asistente virtual. Decime cuáles son tus dudas y te doy información!";

    messages.appendChild(initialMessage);
  });
  </script>

  </body>
</html>
